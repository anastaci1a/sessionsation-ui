[package]
name = "sessionsation-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "New-session terminal popup for sessionsation and HERDR"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
# Level-triggered TTY polling keeps simultaneous resize/input events readable.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
