[package]
name = "sessionsation-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "New-session terminal popup for sessionsation and HERDR"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
