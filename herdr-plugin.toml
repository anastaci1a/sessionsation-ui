id = "sessionsation"
name = "sessionsation"
version = "0.2.0"
min_herdr_version = "0.9.5"
platforms = ["linux"]

[[actions]]
id = "launcher"
title = "Sessionsation"
command = ["./bin/sessionsation-popup", "open"]

[[panes]]
id = "launcher"
title = "Sessionsation"
placement = "popup"
width = "90%"
height = "65%"
command = ["./bin/sessionsation-popup", "popup"]

[[panes]]
id = "manage"
title = "Accounts and sessions"
placement = "overlay"
command = ["./bin/sessionsation-ui", "manage"]

[[panes]]
id = "login"
title = "Provider login"
placement = "overlay"
command = ["./bin/sessionsation-popup", "login-run"]
